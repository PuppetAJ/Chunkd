<!doctype html>
<!-- Dark only: shadcn/ui's "dark:" variants key off this class. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <!-- Pinch to zoom must stay available here: blocking it fails WCAG 1.4.4.
         The editor's double-tap zoom is handled in useSuppressZoomGestures. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17161a" />
    <meta
      name="description"
      content="CHUNK'D - build voxel worlds in your browser and share them."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- og:image goes absolute once the site has a domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CHUNK'D" />
    <meta property="og:title" content="CHUNK'D" />
    <meta
      property="og:description"
      content="Build voxel worlds in your browser and share them."
    />
    <meta property="og:image" content="/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>CHUNK'D</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
