<!doctype html>
<!-- The site is dark only, so the class is fixed here rather than toggled.
     shadcn/ui components carry "dark:" variants that key off it. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale with user-scalable=no is what stops Safari zooming on a
         double tap; this is a pointer-driven 3D editor rather than a document,
         so there is no reflowing text that zooming would help someone read. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#17161a" />
    <meta
      name="description"
      content="CHUNK'D - build voxel worlds in your browser and share them."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CHUNK'D</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
