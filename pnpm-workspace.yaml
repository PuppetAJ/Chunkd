packages:
  - client
  - server

# pnpm does not run a dependency's install scripts unless it is listed here.
allowBuilds:
  # Optional native protobuf acceleration for Apollo usage reporting, which we
  # do not enable. The pure-JavaScript fallback is used instead.
  '@apollo/protobufjs': false
  # The Railway CLI bundles the config file with esbuild, which fetches its binary on install.
  esbuild: true

# Patched releases of packages we only get through other dependencies, until those pick them up. ts-morph only calls
# minimatch(path, pattern), which minimatch 11 keeps.
overrides:
  source-map-js@<1.2.2: ^1.2.2
  '@ts-morph/common>minimatch': ^11.0.1
